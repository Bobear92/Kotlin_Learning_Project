# Spring Boot configuration for the inventory service.
#
# Spring: Spring Boot loads this file automatically from the classpath at startup. Anything
# not set here keeps its auto-configured default.
#
# Why: there is deliberately no `spring.datasource.url`, username or password. When running
# locally, Docker Compose support supplies them from compose.yaml; in tests, Testcontainers'
# `@ServiceConnection` does. No credentials are written in config files.
spring:
  application:
    # Shows up in log lines and identifies the service.
    name: inventory
